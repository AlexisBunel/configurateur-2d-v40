<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Maquette Configuration Verrière V40</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Configuration verrière V40</h1>
    <div id="configuration">
      <svg id="svg-preview" viewBox="0 0 900 550"></svg>
      <section id="forms">
        <form id="configuration-dimensions">
          <h3>Dimensions de la Verrière</h3>
          <label
            >Largeur (mm) :
            <input
              id="width"
              type="number"
              data-config-key="width"
              value="4000"
              min="400"
              max="5000"
          /></label>
          <label
            >Hauteur (mm) :
            <input
              id="height"
              type="number"
              data-config-key="height"
              value="2500"
              min="400"
              max="5000"
          /></label>
        </form>
        <form id="configuration-type">
          <h3>Type de verrière</h3>
          <div>
            <input
              type="radio"
              id="type1"
              name="type"
              value="pleine"
              data-config-key="type"
              checked
            />
            <label for="type1" style="margin-right: 50px">Pleine</label>

            <input
              type="radio"
              id="type2"
              name="type"
              value="porte"
              data-config-key="type"
            />
            <label for="type2">Avec porte</label>
          </div>
        </form>
        <form id="configuration-porte">
          <h3>Porte</h3>
          <label for="tierce">Avec une porte tierce :</label>
          <select name="tierce" id="tierce" data-config-key="porte.withTierce">
            <option value="false" selected>Non</option>
            <option value="true">Oui</option>
          </select>
          <label for="imposte">Porte avec imposte :</label>
          <select
            name="imposte"
            id="imposte"
            data-config-key="porte.withImposte"
          >
            <option value="false" selected>Non</option>
            <option value="true">Oui</option>
          </select>
          <label id="label-dormant" for="dormant"
            >Porte avec dormant haut :</label
          >
          <select
            name="dormant"
            id="dormant"
            data-config-key="porte.withDormant"
          >
            <option value="false" selected>Non</option>
            <option value="true">Oui</option>
          </select>
          <label for="charniere">Type de charnière :</label>
          <select
            name="charniere"
            id="charniere"
            data-config-key="porte.charniereType"
          >
            <option value="visible" selected>Visible</option>
            <option value="invisible">Invisible</option>
          </select>
          <label
            >Largeur de la porte (mm) :
            <input
              type="number"
              data-config-key="porte.porteWidth"
              value="730"
              min="400"
              max="1230"
          /></label>
          <label id="widthTierce"
            >Largeur de la tierce (mm) :
            <input
              type="number"
              data-config-key="porte.tierceWidth"
              value="350"
              min="300"
              max="1230"
          /></label>
          <label
            >Hauteur de la porte (mm) :
            <input
              type="number"
              data-config-key="porte.porteHeight"
              value="2200"
              min="500"
              max="4000"
          /></label>
          <p id="dimensions-ouverture">Dimensions de l'ouverture :</p>
        </form>
        <form id="configuration-modules">
          <h3>Modules</h3>
          <label for="modulesCount">Nombre de modules (dont porte) :</label>
          <select
            name="modulesCount"
            id="modulesCount"
            data-config-key="modulesCount"
          >
            <option value="4" selected>4</option>
          </select>
          <label id="label-modulePorte" for="modulePorte"
            >Emplacement de la porte :</label
          >
          <select
            name="modulePorte"
            id="modulePorte"
            data-config-key="porteIndex"
          >
            <option value="3" selected>3</option>
          </select>
          <label>Largeur des modules (clair de vitrage) :</label>
          <button id="reset-btn" type="button" style="width: fit-content">
            Réinitialiser
          </button>
          <div id="modules-width"></div>
        </form>
        <form id="configuration-traverses">
          <h3>Traverses</h3>
          <button id="add-traverse" type="button">Ajouter une traverse</button>
          <select name="list-traverses" id="list-traverses" class="">
            <option value="" selected>Sélectionner une traverse</option>
          </select>
          <button id="delete-traverse" type="button" class="">
            Supprimer une traverse
          </button>
        </form>
        <form id="configuration-traverses-porte">
          <h3>Traverses sur la porte</h3>
          <label for="type-traverses">Type de traverse :</label>
          <select
            name="type-traverses"
            id="type-traverses"
            data-config-key="porte.traverseType"
          >
            <option value="28" selected>28</option>
            <option value="37">37</option>
          </select>
          <!-- <label for="porte.traverse-tierce">Traverses sur tierce :</label>
          <select
            name="traverse-tierce"
            id="traverse-tierce"
            data-config-key="traverseTierce"
          >
            <option value="false" selected>Non</option>
            <option value="true">Oui</option>
          </select> -->
          <button id="add-traverse-porte" type="button">
            Ajouter une traverse
          </button>
          <select
            name="list-traverses-tierce"
            id="list-traverses-tierce"
            class=""
          >
            <option value="" selected>Sélectionner une traverse</option>
          </select>
          <button id="delete-traverse-tierce" type="button" class="">
            Supprimer une traverse
          </button>
        </form>
        <form id="configuration-options">
          <h3>Options</h3>
          <label for="color-profile">Couleur :</label>
          <select
            name="color-profile"
            id="color-profile"
            data-config-key="options.colorProfile"
          >
            <option value="noir" selected>Laqué noir RAL 9005 granité</option>
            <option value="gris">Laqué gris RAL 7016 granité</option>
            <option value="blanc">Laqué blanc RAL 9003 granité</option>
          </select>
          <label for="ep-remplissage">Remplissage :</label>
          <select
            name="ep-remplissage"
            id="ep-remplissage"
            data-config-key="options.remplissageEp"
          >
            <option value="6" selected>6mm</option>
            <option value="8">8mm</option>
          </select>
          <label for="color-joint">Couleur du joint :</label>
          <select
            name="color-joint"
            id="color-joint"
            data-config-key="options.colorJoint"
          >
            <option value="noir" selected>Noir</option>
            <option value="transp">Transparent</option>
            <option value="blanc">Blanc</option>
          </select>
        </form>
        <form id="configuration-options-porte">
          <h3>Options porte</h3>
          <label for="sens-ouverture">Sens d'ouverture :</label>
          <select
            name="sens-ouverture"
            id="sens-ouverture"
            data-config-key="porte.sensOuverture"
          >
            <option value="droit" selected>Poussant droit</option>
            <option value="gauche">Poussant gauche</option>
          </select>
          <label for="serrure">Serrure :</label>
          <select name="serrure" id="serrure" data-config-key="porte.serrure">
            <option value="SERROULM" selected>SERROULM - Rouleau seul</option>
            <option value="SERROULPENM">
              SERROULPENM - Rouleau + Pêne + 1/2 cylindre
            </option>
            <option value="SERPEN35M">
              SERPEN35M - Pêne demi-tour + Pêne dormant
            </option>
          </select>
          <label for="po66-profile">Profil :</label>
          <select
            name="po66-profile"
            id="po66-profile"
            data-config-key="porte.profile"
          >
            <option value="po66" selected>
              PO66 - Profil Porte Ouvrante 66
            </option>
            <option value="po6622u">
              PO6622U - Profil Porte Ouvrante 66 usiné
            </option>
          </select>
          <label for="color-bequille">Couleur béquille :</label>
          <select
            name="color-bequille"
            id="color-bequille"
            data-config-key="porte.colorBequille"
          >
            <option value="noir" selected>Noir</option>
            <option value="inox">Inox</option>
          </select>
          <label for="color-pvitrage">Couleur joint de vitrage :</label>
          <select
            name="color-pvitrage"
            id="color-pvitrage"
            data-config-key="porte.colorPvitrage"
          >
            <option value="noir" selected>Noir</option>
            <option value="transp">Transparent</option>
          </select>
        </form>
      </section>
    </div>
    <section id="recapitulatif">
      <table id="profiles"></table>
      <table id="accessoires"></table>
      <table id="remplissage"></table>
    </section>
    <script src=""></script>
  </body>
</html>
